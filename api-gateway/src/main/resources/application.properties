spring.application.name=api-gateway

server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-characters-for-hmac-sha256-algorithm}
jwt.expiration=86400000

# Gateway Routes
  spring.cloud.gateway.routes[0].id=device-service
  spring.cloud.gateway.routes[0].uri=http://localhost:8081
  spring.cloud.gateway.routes[0].predicates[0]=Path=/api/devices/**,/api/manufacturers/**,/api/device-types/**,/api/device-statuses/**,/api/device-models/**

  spring.cloud.gateway.routes[1].id=location-service
  spring.cloud.gateway.routes[1].uri=http://localhost:8082
  spring.cloud.gateway.routes[1].predicates[0]=Path=/api/stations/**,/api/rooms/**,/api/racks/**,/api/rack-positions/**,/api/device-locations/**

  spring.cloud.gateway.routes[2].id=network-service
  spring.cloud.gateway.routes[2].uri=http://localhost:8083
  spring.cloud.gateway.routes[2].predicates[0]=Path=/api/vlans/**,/api/subnets/**,/api/ip-addresses/**,/api/network-interfaces/**

  spring.cloud.gateway.routes[3].id=auth-service
  spring.cloud.gateway.routes[3].uri=http://localhost:8084
  spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**,/api/roles/**,/api/auth/**

spring.cloud.gateway.routes[4].id=audit-service
  spring.cloud.gateway.routes[4].uri=http://localhost:8085
  spring.cloud.gateway.routes[4].predicates[0]=Path=/api/audit-logs/**

  # Actuator
  management.endpoints.web.exposure.include=health,info,metrics,gateway

  # Logging
  logging.level.org.springframework.cloud.gateway=DEBUG

  # CORS (для frontend в будущем)
  spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
  spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
  spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*