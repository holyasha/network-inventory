spring.application.name=api-gateway

server.port=8080

# Gateway Routes
  spring.cloud.gateway.routes[0].id=device-service
  spring.cloud.gateway.routes[0].uri=http://localhost:8081
  spring.cloud.gateway.routes[0].predicates[0]=Path=/api/devices/**

  spring.cloud.gateway.routes[1].id=location-service
  spring.cloud.gateway.routes[1].uri=http://localhost:8082
  spring.cloud.gateway.routes[1].predicates[0]=Path=/api/locations/**,/api/stations/**,/api/rooms/**,/api/racks/**

  spring.cloud.gateway.routes[2].id=network-service
  spring.cloud.gateway.routes[2].uri=http://localhost:8083
  spring.cloud.gateway.routes[2].predicates[0]=Path=/api/network/**,/api/vlans/**,/api/subnets/**,/api/ip-addresses/**

  spring.cloud.gateway.routes[3].id=auth-service
  spring.cloud.gateway.routes[3].uri=http://localhost:8084
  spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[4].id=audit-service
  spring.cloud.gateway.routes[4].uri=http://localhost:8085
  spring.cloud.gateway.routes[4].predicates[0]=Path=/api/audit/**

  # Actuator
  management.endpoints.web.exposure.include=health,info,metrics,gateway

  # Logging
  logging.level.org.springframework.cloud.gateway=DEBUG

    # CORS (для frontend в будущем)
